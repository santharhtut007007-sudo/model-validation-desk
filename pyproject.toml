[project]
name = "mvdesk"
version = "0.1.0"
description = "Independent SR 11-7 style validation of a market-risk VaR model, with an Excel validation pack and an interactive dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=9.0.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "yfinance>=1.8.0",
]

[project.scripts]
mvdesk = "mvdesk:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
