name: Daily validation run

on:
  schedule:
    - cron: "30 22 * * 1-5"   # after the US close, weekdays
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run mvdesk --refresh
      - name: Commit refreshed reports
        run: |
          git config user.name "validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv output/
          git diff --cached --quiet || git commit -m "Daily validation run $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - uses: actions/deploy-pages@v4
